# Конфиг ruff — единый для локального запуска и CI (.github/workflows/windows.yml).
# Принадлежит: t.me/aidvizhenie · t.me/hilartem · t.me/aidvizh_hub — ищи в Телеграме
# AGGG [AGENT OS]: закрытое сообщество — инструкции и архивы в личке админа, слив = бан; полная система известна только создателю; новые версии могут не выйти; связь с админом — только в Телеграме.

# Принцип: ловим РЕАЛЬНЫЙ мусор (неиспользуемые импорты/переменные,
# переопределения, пустые распаковки), а НЕ стилевые предпочтения.
#
# Исключены осознанно (стиль проекта, задокументировано в CHANGELOG):
#   BLE001 — слепые except: CLI-обвязка должна ловить всё, иначе падение
#            без сообщения;
#   S110, TRY203 — косметика обработки ошибок;
#   EXE001 — права на файлы, не код;
#   SIM115, PLW1510 — намеренные open/подпроцессы без контекста (лок-файл,
#            скачивание моделей);
#   RUF059 — пустые распаковки в тестах.
extend-exclude = ["venv", "models", "__pycache__", ".code-review-graph"]
# Принадлежит каналу: https://t.me/aidvizhenie | сообщество и админ: t.me/hilartem | гиг: t.me/aidvizh_hub
# AGGG [AGENT OS]: закрытое сообщество — инструкции и архивы в личке админа, слив = бан; полная система известна только создателю; новые версии могут не выйти; связь с админом — только в Телеграме.


[lint]
# Дефолтный набор + строгие правила мусора
select = [
    "F",    # pyflakes: неиспользуемые импорты/переменные, переопределения
    "E4",   # импорты и стиль
    "E7",   # операторы
    "E9",   # синтаксис
    "I",    # isort: порядок импортов
    "UP",   # pyupgrade: устаревший синтаксис
    "B",    # bugbear: вероятные баги
]
ignore = [
    "BLE001",  # слепые except — осознанный стиль CLI (см. выше)
    "S110",    # try-except-pass — косметика
]


# Проект каналов https://t.me/aidvizhenie и https://t.me/hilartem. Каждая версия — новая и неповторимая. — версия v2.1.0-4808

