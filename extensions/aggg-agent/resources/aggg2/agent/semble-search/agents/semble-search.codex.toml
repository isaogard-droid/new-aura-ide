# Субагент semble-search для Codex.

name = "semble-search"
description = "Узкий специалист по поиску в коде и доках AGGG2.0: находит код по смыслу, локации и связям через Semble, db-tools и agent-lsp; возвращает компактно ФАЙЛ/СУТЬ/ДОПОЛНИТЕЛЬНО. Не правит код и не ходит в веб."
model_reasoning_effort = "medium"
